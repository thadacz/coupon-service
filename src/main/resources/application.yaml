spring:
  application:
    name: coupon-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coupons}
    username: ${DB_USERNAME:coupons}
    password: ${DB_PASSWORD:coupons}
    hikari:
      # With virtual threads the pool is the real concurrency limit: fail fast instead of queueing forever.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 2000 # ms: Hikari binds a plain long, a "2s" duration is rejected
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  http:
    serviceclient:
      geo:
        base-url: ${GEO_BASE_URL:https://api.country.is}
        connect-timeout: 500ms
        read-timeout: 1s
  cache:
    cache-names: ip-country
    caffeine:
      spec: maximumSize=100000,expireAfterWrite=24h

server:
  shutdown: graceful
  # Tomcat's RemoteIpValve: X-Forwarded-For is honoured only when the request comes from a
  # trusted proxy (server.tomcat.remoteip.internal-proxies; default: loopback and private
  # networks). In production set it to the load balancer's addresses. Never trust the header
  # from arbitrary clients: anyone could claim a Polish IP.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Readiness deliberately ignores the geolocation provider: its outage must not
      # take every pod out of the load balancer. It is handled per request (503).
      group:
        readiness:
          include: readinessState, db

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      # JSON lines in Elastic Common Schema, ready for an ELK pipeline.
      console: ecs
