spring:
  application:
    name: coupon-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coupons}
    username: ${DB_USERNAME:coupons}
    password: ${DB_PASSWORD:coupons}
    hikari:
      # With virtual threads the pool is the real concurrency limit: fail fast instead of queueing forever.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 2000 # ms: Hikari binds a plain long, a "2s" duration is rejected
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

coupons:
  geolocation:
    # DB-IP's IP to Country Lite in MaxMind DB format, as a Spring resource location. The default
    # is where ./gradlew downloadGeoDatabase puts it (bootRun does that); the image sets GEO_DATABASE.
    database: ${GEO_DATABASE:file:build/geo/dbip-country-lite.mmdb}

server:
  shutdown: graceful
  # Tomcat's RemoteIpValve: X-Forwarded-For is honoured only when the request comes from a
  # trusted proxy (server.tomcat.remoteip.internal-proxies; default: loopback and private
  # networks). In production set it to the load balancer's addresses. Never trust the header
  # from arbitrary clients: anyone could claim a Polish IP.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Readiness checks the database: an instance that cannot reach it leaves the load
      # balancer until it can. Liveness stays up, so the instance is not restarted for it.
      group:
        readiness:
          include: readinessState, db

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      # JSON lines in Elastic Common Schema, ready for an ELK pipeline.
      console: ecs
